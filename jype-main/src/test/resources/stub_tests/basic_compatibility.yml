name: Basic Compatibility Tests

tests:
  subclass_test:
    expect:
      - status: true
    solver: COMPATIBILITY
    constraints:
      - subtype:
          - Ljava/lang/String;
          - Ljava/lang/CharSequence;

  not_subclass_test:
    expect:
      - status: false
    solver: COMPATIBILITY
    constraints:
      - subtype:
          - Ljava/lang/CharSequence;
          - Ljava/lang/String;

  generic_unchecked_test:
    expect:
      - status: true
    solver: COMPATIBILITY
    constraints:
      - subtype:
          - Ljava/util/ArrayList<Ljava/lang/String;>;
          - Ljava/util/List;

  not_generic_unchecked_test:
    expect:
      - status: false
    solver: COMPATIBILITY
    constraints:
      - subtype:
          - Ljava/util/List;
          - Ljava/util/ArrayList<Ljava/lang/String;>;

  unchecked_wildcard_test:
    expect:
      - status: true
    solver: COMPATIBILITY
    constraints:
      - subtype:
          - Ljava/util/List<-Ljava/lang/Object;>;
          - Ljava/util/List;
      - subtype:
          - Ljava/util/List;
          - Ljava/util/List<-Ljava/lang/Object;>;

  loose_invocation_unboxing_then_widening_test:
    expect:
      - status: true
    solver: COMPATIBILITY
    constraints:
      - compatible:
          context: LOOSE_INVOCATION
          children:
            - Ljava/lang/Integer;
            - J

  loose_invocation_boxing_then_widening_test:
    expect:
      - status: true
    solver: COMPATIBILITY
    constraints:
      - compatible:
          context: LOOSE_INVOCATION
          children:
            - I
            - Ljava/lang/Object;

  strict_invocation_rejects_unboxing_test:
    expect:
      - status: false
    solver: COMPATIBILITY
    constraints:
      - compatible:
          context: STRICT_INVOCATION
          children:
            - Ljava/lang/Integer;
            - J
