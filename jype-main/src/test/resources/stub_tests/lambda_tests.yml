name: Lambda Tests

tests:

  # --- Lambda Expression Tests ---

  # () -> run() satisfies Runnable: 0 params, void return, no constraints emitted
  lambda_runnable:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/lang/Runnable;
          expr:
            lambda:
              parameterCount: 0
              implicitReturn: false
              body:
                constant: 0

  # () -> "hello" satisfies Supplier<String>: body type String <: SAM return String
  lambda_supplier_string:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/Supplier<Ljava/lang/String;>;
          expr:
            lambda:
              parameterCount: 0
              implicitReturn: true
              body:
                constant: hello

  # (String s) -> void satisfies Consumer<String>: explicit param Equal(String, String)
  lambda_consumer_explicit_param:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/Consumer<Ljava/lang/String;>;
          expr:
            lambda:
              parameterTypes:
                - Ljava/lang/String;
              implicitReturn: false
              body:
                constant: 0

  # (String s) -> "hello" satisfies Function<String, String>: param Equal + body return
  lambda_function_explicit_param:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/Function<Ljava/lang/String;Ljava/lang/String;>;
          expr:
            lambda:
              parameterTypes:
                - Ljava/lang/String;
              implicitReturn: true
              body:
                constant: hello

  # (a, b) -> 0 satisfies Comparator<String>: implicit 2-param, body int matches SAM return int
  lambda_comparator_implicit_params:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/Comparator<Ljava/lang/String;>;
          expr:
            lambda:
              parameterCount: 2
              implicitReturn: true
              body:
                constant: 0

  # (String a, String b) -> void does NOT satisfy Runnable (0 params): wrong param count
  lambda_wrong_param_count:
    expect:
      - status: false
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/lang/Runnable;
          expr:
            lambda:
              parameterTypes:
                - Ljava/lang/String;
                - Ljava/lang/String;
              implicitReturn: false
              body:
                constant: 0

  # () -> 42 does NOT satisfy Supplier<String>: body type int is not compatible with String
  lambda_wrong_return_type:
    expect:
      - status: false
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/Supplier<Ljava/lang/String;>;
          expr:
            lambda:
              parameterCount: 0
              implicitReturn: true
              body:
                constant: 42

  # Lambda targeting a class (not an interface) is always false
  lambda_not_interface:
    expect:
      - status: false
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/lang/Object;
          expr:
            lambda:
              parameterCount: 0
              implicitReturn: false
              body:
                constant: 0

  # Lambda targeting an interface with no SAM (Serializable = marker interface) is false
  lambda_no_sam:
    expect:
      - status: false
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/io/Serializable;
          expr:
            lambda:
              parameterCount: 0
              implicitReturn: false
              body:
                constant: 0

  # --- Method Reference Tests ---

  # String::length used as Function<String, Integer>:
  # unbound instance ref, first SAM param (String) is receiver, return int boxes to Integer
  method_ref_unbound_instance:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/Function<Ljava/lang/String;Ljava/lang/Integer;>;
          expr:
            invocation_ref:
              staticSource: Ljava/lang/String;
              methodName: length

  # Integer::parseInt used as Function<String, Integer>:
  # static method ref, SAM param String matches parseInt(String), return int boxes to Integer
  method_ref_static:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/Function<Ljava/lang/String;Ljava/lang/Integer;>;
          expr:
            invocation_ref:
              staticSource: Ljava/lang/Integer;
              methodName: parseInt

  # Arrays::asList used as BiFunction<String, String, List<String>>:
  # static vararg method <T> List<T> asList(T... a), 2 fixed SAM params spread into the vararg array
  method_ref_static_vararg:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/BiFunction<Ljava/lang/String;Ljava/lang/String;Ljava/util/List<Ljava/lang/String;>;>;
          expr:
            invocation_ref:
              staticSource: Ljava/util/Arrays;
              methodName: asList

  # PrintStream::printf used as BiFunction<PrintStream, String, PrintStream>:
  # unbound instance vararg method printf(String, Object...), first SAM param is the receiver,
  # second SAM param matches the fixed "format" param, zero args spread into the vararg
  method_ref_unbound_instance_vararg:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/BiFunction<Ljava/io/PrintStream;Ljava/lang/String;Ljava/io/PrintStream;>;
          expr:
            invocation_ref:
              staticSource: Ljava/io/PrintStream;
              methodName: printf

  # PrintStream::printf used as BiFunction<PrintStream, Integer, PrintStream>: the second SAM param
  # (Integer) is not compatible with printf's fixed "format" String parameter, so this must fail
  method_ref_unbound_instance_vararg_wrong_type:
    expect:
      - status: false
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/BiFunction<Ljava/io/PrintStream;Ljava/lang/Integer;Ljava/io/PrintStream;>;
          expr:
            invocation_ref:
              staticSource: Ljava/io/PrintStream;
              methodName: printf

  # --- Constructor Reference Tests ---

  # Thread::new used as Runnable: Thread() has 0 params, Runnable.run() returns void
  constructor_ref_runnable:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/lang/Runnable;
          expr:
            instantiation_ref:
              type: Ljava/lang/Thread;

  # StringBuilder::new used as Supplier<StringBuilder>: no-arg ctor, return type matches SAM
  constructor_ref_supplier:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/Supplier<Ljava/lang/StringBuilder;>;
          expr:
            instantiation_ref:
              type: Ljava/lang/StringBuilder;

  # int[]::new used as IntFunction<int[]>: array creation reference (JLS 15.13.1),
  # synthetic single int-length parameter, return type matches the array type
  constructor_ref_array:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/IntFunction<[I>;
          expr:
            instantiation_ref:
              type: "[I"

  # int[]::new used as IntFunction<String[]>: the created array type (int[]) is not
  # compatible with the SAM's required return type (String[]), so this must fail
  constructor_ref_array_wrong_component:
    expect:
      - status: false
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/IntFunction<[Ljava/lang/String;>;
          expr:
            instantiation_ref:
              type: "[I"

  # ProcessBuilder::new used as BiFunction<String, String, ProcessBuilder>:
  # vararg ctor ProcessBuilder(String... command), both SAM params spread into the vararg array
  constructor_ref_vararg:
    expect:
      - status: true
    constraints:
      - expression_compatible:
          context: ASSIGNMENT
          type: Ljava/util/function/BiFunction<Ljava/lang/String;Ljava/lang/String;Ljava/lang/ProcessBuilder;>;
          expr:
            instantiation_ref:
              type: Ljava/lang/ProcessBuilder;
